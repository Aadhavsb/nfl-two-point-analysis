[project]
name = "nfl-two-point"
version = "0.1.0"
description = "Point-in-time NFL post-touchdown two-point decision analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nflreadpy>=0.1.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.1"]
report = ["jupyter>=1.1"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
nfl-two-point = "nfl_two_point.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
